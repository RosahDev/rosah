<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | ROSah Media</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .contact-wrapper { display: grid; grid-template-columns: 1fr; gap: 4rem; margin-top: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-family: var(--font-title); font-size: 0.9rem; color: var(--text-gray); }
    .form-control { width: 100%; padding: 1rem; background: var(--bg-light); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; font-family: var(--font-text); transition: all 0.3s; }
    .form-control:focus { outline: none; border-color: var(--neon-purple); box-shadow: var(--glow-purple); }
    textarea.form-control { resize: vertical; min-height: 150px; }
    @media (min-width: 768px) { .contact-wrapper { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container fade-in">
    <h1>Vamos Trabalhar Juntos</h1>
    
    <div class="contact-wrapper">
      <div class="contact-info">
        <p style="margin-bottom: 2rem; color: var(--text-gray);">Seja para uma sessão de fotos automotiva, um projeto de desenvolvimento web ou uma colaboração criativa, me mande uma mensagem.</p>
        <h3 style="color: var(--neon-purple);">Email</h3>
        <p style="margin-bottom: 1rem;">contato@rosahmedia.com</p>
        <h3 style="color: var(--neon-purple);">Localização</h3>
        <p>Araraquara, SP - Brasil</p>
      </div>

      <form class="contact-form" action="https://formspree.io/f/SEU_ID_AQUI" method="POST">
        <div class="form-group">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea id="message" name="message" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
