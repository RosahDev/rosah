<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | ROSah Media</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: var(--bg-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .admin-box { background: var(--bg-light); padding: 2rem; border-radius: 8px; width: 100%; max-width: 600px; border: 1px solid var(--neon-purple); box-shadow: var(--glow-purple); }
    .form-group { margin-bottom: 1rem; }
    .form-control { width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; }
    #login-section, #dashboard-section { display: none; }
    .active-section { display: block !important; }
  </style>
</head>
<body>

  <div class="admin-box" id="login-section" class="active-section">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">ROSah Admin Login</h2>
    <div class="form-group">
      <input type="email" id="admin-email" class="form-control" placeholder="E-mail">
    </div>
    <div class="form-group">
      <input type="password" id="admin-password" class="form-control" placeholder="Senha">
    </div>
    <button id="login-btn" class="btn btn-primary" style="width: 100%;">Entrar</button>
  </div>

  <div class="admin-box" id="dashboard-section">
    <h2>Adicionar Novo Projeto</h2>
    <hr style="border-color: rgba(255,255,255,0.1); margin: 1rem 0;">
    <form id="add-project-form">
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="p-title" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <select id="p-category" class="form-control" required>
          <option value="fotografia">Fotografia</option>
          <option value="video">Vídeo</option>
          <option value="design">Design</option>
          <option value="programacao">Programação</option>
        </select>
      </div>
      <div class="form-group">
        <label>Imagem de Capa (Upload)</label>
        <input type="file" id="p-image-file" class="form-control" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <textarea id="p-description" class="form-control" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label>Ferramentas (separadas por vírgula)</label>
        <input type="text" id="p-tools" class="form-control" placeholder="ex: Photoshop, React, Blender">
      </div>
      <div class="form-group">
        <label>Link do Vídeo (Opcional)</label>
        <input type="url" id="p-video" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">Salvar Projeto</button>
    </form>
    <button id="logout-btn" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">Sair</button>
  </div>

  <script src="../js/supabaseClient.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
