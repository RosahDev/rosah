<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto | Rosah Media</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .project-header { margin-top: 2rem; text-align: center; }
    .project-cover { width: 100%; max-height: 60vh; object-fit: cover; border-radius: 8px; margin: 2rem 0; box-shadow: var(--glow-purple); }
    .project-details { display: grid; grid-template-columns: 1fr; gap: 2rem; margin-bottom: 4rem; }
    .tools-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; }
    .tool-badge { background: var(--bg-light); border: 1px solid var(--neon-purple); padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; transition: transform 0.3s; cursor: pointer; }
    .gallery img:hover { transform: scale(1.02); }
    @media (min-width: 768px) { .project-details { grid-template-columns: 2fr 1fr; } }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>
  <div id="navbar-placeholder"></div>

  <main class="container fade-in" id="project-content">
    <div class="spinner" style="margin: 100px auto;"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/supabaseClient.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');
      const container = document.getElementById('project-content');

      if (!projectId) {
        container.innerHTML = '<h2>Projeto não encontrado.</h2><a href="projetos.html" class="btn btn-outline">Voltar</a>';
        return;
      }

      try {
        const { data: project, error } = await window.supabase
          .from('projects')
          .select('*')
          .eq('id', projectId)
          .single();

        if (error) throw error;

        // Renderiza ferramentas (se houver)
        let toolsHTML = '';
        if (project.tools && project.tools.length > 0) {
          toolsHTML = project.tools.map(t => `<span class="tool-badge">${t}</span>`).join('');
        }

        container.innerHTML = `
          <div class="project-header fade-in">
            <span style="color: var(--neon-purple); text-transform: uppercase; letter-spacing: 2px;">${project.category}</span>
            <h1 style="font-size: clamp(2rem, 4vw, 3.5rem); margin: 10px 0;">${project.title}</h1>
            <p style="color: var(--text-gray);">${new Date(project.date).toLocaleDateString('pt-BR')}</p>
          </div>

          <img src="${project.cover_image}" alt="${project.title}" class="project-cover fade-in">

          <div class="project-details fade-in">
            <div class="description">
              <h3>Sobre o Projeto</h3>
              <p style="margin-top: 1rem; color: var(--text-gray); white-space: pre-line;">${project.description}</p>
            </div>
            <div class="meta-info">
              <h3>Tecnologias / Ferramentas</h3>
              <div class="tools-list">${toolsHTML}</div>
              
              ${project.video_url ? `
                <h3 style="margin-top: 2rem;">Vídeo</h3>
                <a href="${project.video_url}" target="_blank" class="btn btn-primary" style="display: inline-block; margin-top: 1rem;">Assistir Vídeo</a>
              ` : ''}
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Erro:', error);
        container.innerHTML = '<h2>Erro ao carregar o projeto.</h2><a href="projetos.html" class="btn btn-outline">Voltar</a>';
      }
    });
  </script>
</body>
</html>
