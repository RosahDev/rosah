<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto | Rosah Media</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .project-header { margin-top: 2rem; text-align: center; }
    .project-cover { width: 100%; max-height: 60vh; object-fit: cover; border-radius: 8px; margin: 2rem 0; box-shadow: var(--glow-purple); }
    .project-details { display: grid; grid-template-columns: 1fr; gap: 2rem; margin-bottom: 4rem; }
    .tools-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; }
    .tool-badge { background: var(--bg-light); border: 1px solid var(--neon-purple); padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; transition: transform 0.3s; cursor: pointer; }
    .gallery img:hover { transform: scale(1.02); }
    @media (min-width: 768px) { .project-details { grid-template-columns: 2fr 1fr; } }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>
  <div id="navbar-placeholder"></div>

  <main class="container fade-in" id="project-content">
    <div class="spinner" style="margin: 100px auto;"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/supabaseClient.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/projectDetails.js"></script>
</body>
</html>
