<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio | Rosah Media</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .filters {
      display: flex;
      gap: 1rem;
      margin: 2rem 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-bar {
      width: 100%;
      max-width: 350px;
      padding: 0.75rem 1rem;
      background: var(--bg-white);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: var(--text-primary);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: var(--shadow-md);
      background: var(--bg-white);
    }

    .search-bar::placeholder {
      color: var(--text-light);
    }

    .filter-btn {
      background: var(--bg-white);
      color: var(--text-primary);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>
  <div id="navbar-placeholder"></div>

  <main class="container fade-in">
    <h1>Portfólio</h1>
    
    <div class="filters">
      <input type="text" id="search-input" class="search-bar" placeholder="Buscar projetos...">
      <button class="btn filter-btn" data-category="all">Todos</button>
      <button class="btn filter-btn" data-category="fotografia">Fotografia</button>
      <button class="btn filter-btn" data-category="video">Vídeo</button>
      <button class="btn filter-btn" data-category="programacao">Programação</button>
      <button class="btn filter-btn" data-category="design">Design</button>
    </div>

    <div class="projects-grid" id="projects-container"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/supabaseClient.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../components/projectCard.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/projects.js"></script>
</body>
</html>
